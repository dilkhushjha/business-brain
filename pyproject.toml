[project]
name = "business-brain"
version = "0.1.0"
description = "Evidence-first business intelligence for Indian SMEs"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115","uvicorn[standard]>=0.30","pydantic>=2.8","pydantic-settings>=2.4","sqlalchemy>=2.0","psycopg[binary]>=3.2","alembic>=1.13","polars>=1.0","pandas>=2.2","openpyxl>=3.1","rapidfuzz>=3.9","redis>=5.0","celery>=5.4","scikit-learn>=1.5"]
[project.optional-dependencies]
dev = ["pytest>=8.3","pytest-asyncio>=0.23","ruff>=0.6"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
