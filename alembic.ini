[alembic]
script_location = packages/shared/database/migrations
prepend_sys_path = .
sqlalchemy.url = postgresql://business_brain:business_brain@localhost:5432/business_brain

# Standard Alembic logging config -- required by env.py's fileConfig() call.
# Missing entirely before this; without it, every `alembic` command failed
# immediately with KeyError: 'formatters', before ever reaching a migration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
