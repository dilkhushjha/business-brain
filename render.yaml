# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: business-brain-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CONNECTOR_REGISTRATION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: ENABLE_API_DOCS
        value: "false"
      - key: MAX_UPLOAD_BYTES
        value: "25000000"
