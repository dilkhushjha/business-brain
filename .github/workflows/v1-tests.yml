name: Business Brain V1 Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: business_brain
          POSTGRES_PASSWORD: business_brain
          POSTGRES_DB: business_brain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U business_brain -d business_brain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://business_brain:business_brain@localhost:5432/business_brain
      APP_ENV: test
      JWT_SECRET_KEY: test-secret-key-for-ci-only-1234567890
      ENABLE_API_DOCS: "false"
      CONNECTOR_REGISTRATION_KEY: test-connector-registration-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall apps packages tests

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Tests
        run: pytest -q

